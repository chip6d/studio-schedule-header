<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio 使用时间表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    background: #EEF0F3; color: #1A1B1C;
    min-height: 100vh;
  }
  .app { max-width: 1180px; margin: 0 auto; padding: 24px 28px 40px; }

  /* 主卡片 */
  .card {
    background: #fff; border-radius: 14px; padding: 22px 28px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* 卡片头部：品牌 + 日期导航 */
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .brand { font-size: 13px; letter-spacing: 3px; color: #6B7280; text-transform: uppercase; }
  .date-nav { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .date-nav button {
    width: 38px; height: 38px; border: 1px solid #D1D5DB; background: #fff;
    border-radius: 8px; font-size: 18px; cursor: pointer; color: #374151;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .date-nav button:hover { background: #F3F4F6; }
  .date-nav button:disabled { opacity: .35; cursor: default; }
  .date-display {
    font-size: 22px; font-weight: 700; min-width: 190px; text-align: center;
  }
  .date-display .wd { font-size: 14px; color: #6B7280; font-weight: 400; margin-left: 8px; }
  .today-btn {
    height: 38px; padding: 0 16px; border: 1px solid #1A1B1C; background: #1A1B1C;
    color: #fff; border-radius: 8px; font-size: 13px; cursor: pointer;
    width: auto !important;
  }
  .today-btn:hover { background: #374151; }

  /* 泳道 */
  .lane { display: flex; margin-bottom: 14px; align-items: stretch; }
  .lane-label {
    width: 90px; flex: 0 0 90px; padding-right: 14px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .lane-label .name { font-size: 16px; font-weight: 700; }
  .lane-label .sub { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
  .track {
    position: relative; flex: 1; height: 72px;
    background: #FAFAF9; border: 1px solid #E5E7EB; border-radius: 8px; overflow: hidden;
  }
  .hour-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed #E5E7EB; }
  .hour-mark { position: absolute; top: 4px; font-size: 10px; color: #9CA3AF; transform: translateX(-50%); }
  .start-mark { position: absolute; top: 4px; left: 4px; font-size: 10px; color: #9CA3AF; }
  .block {
    position: absolute; top: 10px; bottom: 10px;
    border-radius: 6px; color: #fff; padding: 6px 10px;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; border: 1px solid rgba(0,0,0,.15);
  }
  .block .b-title { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .block .b-time { font-size: 11px; opacity: .9; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .block .b-owner { font-size: 10px; opacity: .8; margin-top: 1px; }
  .c-A { background: #3E6FA8; }
  .c-B { background: #3E8E72; }
  .c-E { background: #7D55A8; }
  .blur { filter: blur(3.5px); user-select: none; -webkit-user-select: none; }

  /* 当前时间绿线 */
  .now-line {
    position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 2px solid #22C55E; z-index: 5; pointer-events: none;
  }
  .now-line::before {
    content: ""; position: absolute; top: -3px; left: -4px;
    width: 8px; height: 8px; border-radius: 50%; background: #22C55E;
  }
  .now-line .now-label {
    position: absolute; top: 2px; left: 6px;
    font-size: 10px; font-weight: 700; color: #16A34A;
    background: rgba(255,255,255,.9); padding: 1px 5px; border-radius: 3px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  .empty-note {
    text-align: center; color: #9CA3AF; font-size: 13px; padding: 20px 0;
  }

  /* 明细 */
  .detail { margin-top: 22px; border-top: 1px solid #E5E7EB; padding-top: 16px; }
  .detail .d-title { font-size: 12px; font-weight: 700; color: #6B7280; margin-bottom: 10px; letter-spacing: 2px; }
  .detail table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail th, .detail td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
  .detail th { color: #9CA3AF; font-weight: 600; font-size: 11px; letter-spacing: 1px; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 700; }
  .tag-A { background: #3E6FA8; } .tag-B { background: #3E8E72; } .tag-E { background: #7D55A8; }
  .qr-cell { text-align: center; }
  .qr-cell svg { display: block; margin: 0 auto; }
  .qr-cell .qr-label { font-size: 10px; color: #9CA3AF; margin-top: 2px; }

  .footer { margin-top: 18px; font-size: 11px; color: #9CA3AF; text-align: right; }
  .live-dot { display: inline-block; width: 7px; height: 7px; background: #3E8E72; border-radius: 50%; margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  @media (max-width: 720px) {
    .app { padding: 14px; }
    .card { padding: 16px; }
    .lane-label { width: 70px; flex: 0 0 70px; }
    .date-display { font-size: 18px; min-width: 140px; }
    .detail { overflow-x: auto; }
    .detail table { min-width: 560px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="card-header">
      <div class="brand">Cashmere Studio · Room Schedule</div>
      <div class="date-nav">
        <button id="prevBtn" title="前一天">&#8249;</button>
        <div class="date-display"><span id="dateText"></span><span class="wd" id="wdText"></span></div>
        <button id="nextBtn" title="后一天">&#8250;</button>
        <button class="today-btn" id="todayBtn">今天</button>
      </div>
    </div>

    <div id="lanes"></div>

    <div class="detail">
      <div class="d-title">当日占用明细</div>
      <div style="overflow-x:auto;">
        <table id="detailTable">
          <thead>
            <tr>
              <th style="width:12%">工作室</th>
              <th style="width:14%">时间段</th>
              <th>内容</th>
              <th style="width:10%">负责人</th>
              <th style="width:18%">飞书联系</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
    <div class="footer"><span class="live-dot"></span>自动同步当天 · 数据来源：飞书日历 · 时间轴 9:00–21:00</div>
  </div>
</div>

  var pct = (nowMin - DAY_START) / (DAY_END - DAY_START) * 100;
  return '<div class="now-line" style="left:' + pct.toFixed(2) + '%">' +
    '<span class="now-label">' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '</span></div>';
}

function render() {
  var key = fmtDate(currentDate);
  document.getElementById("dateText").textContent =
    currentDate.getFullYear() + "年" + (currentDate.getMonth()+1) + "月" + currentDate.getDate() + "日";
  document.getElementById("wdText").textContent = WEEKDAYS[currentDate.getDay()];

  var events = SCHEDULE[key] || [];
  var isToday = (key === fmtDate(new Date()));
  var studios = [
    {key:"A", name:"Studio A", sub:"Cashmere"},
    {key:"B", name:"Studio B", sub:"Flannel"},
    {key:"E", name:"Studio E", sub:"Velour"}
  ];
  var lanesHtml = "";
  studios.forEach(function(s) {
    var blocks = events.filter(function(e){ return e.studio === s.key; }).map(function(e) {
      var sMin = toMin(e.start), eMin = toMin(e.end);
      var left = (sMin - DAY_START) / (DAY_END - DAY_START) * 100;
      var width = (eMin - sMin) / (DAY_END - DAY_START) * 100;
      return '<div class="block c-' + e.studio + '" style="left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%">' +
        '<div class="b-title blur">' + e.title + '</div>' +
        '<div class="b-time">' + e.start + ' – ' + e.end + '</div>' +
        '<div class="b-owner">' + e.owner + '</div></div>';
    }).join("");
    lanesHtml += '<div class="lane"><div class="lane-label"><div class="name">' + s.name +
      '</div><div class="sub">' + s.sub + '</div></div><div class="track">' + buildGrid() +
      (isToday ? nowLineHtml() : "") + blocks + '</div></div>';
  });
  document.getElementById("lanes").innerHTML = lanesHtml;

  var tbody = document.getElementById("detailBody");
  if (events.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-note">当日三个 Studio 均无安排</td></tr>';
  } else {
    tbody.innerHTML = events.map(function(e) {
      var qr = QR[e.owner] || "";
      return '<tr>' +
        '<td><span class="tag tag-' + e.studio + '">' + (e.studio==="A"?"Studio A":e.studio==="B"?"Studio B":"Studio E") + '</span></td>' +
        '<td>' + e.start + ' – ' + e.end + '</td>' +
        '<td class="blur">' + e.title + '</td>' +
        '<td>' + e.owner + '</td>' +
        '<td class="qr-cell">' + qr + '<div class="qr-label">扫码联系 ' + e.owner + '</div></td>' +
        '</tr>';
    }).join("");
  }
}

function updateNowLine() {
  if (fmtDate(currentDate) !== fmtDate(new Date())) return;
  var html = nowLineHtml();
  document.querySelectorAll(".track").forEach(function(track) {
    var old = track.querySelector(".now-line");
    if (old) old.remove();
    if (html) track.insertAdjacentHTML("beforeend", html);
  });
}

function goToday() { currentDate = new Date(); render(); }
function goPrev() { currentDate = new Date(currentDate.getTime() - 86400000); render(); }
function goNext() { currentDate = new Date(currentDate.getTime() + 86400000); render(); }

document.getElementById("prevBtn").addEventListener("click", goPrev);
document.getElementById("nextBtn").addEventListener("click", goNext);
document.getElementById("todayBtn").addEventListener("click", goToday);

goToday();

// 每分钟：更新绿线位置 + 检查跨天
setInterval(function() {
  var now = new Date();
  if (fmtDate(now) !== fmtDate(currentDate)) {
    currentDate = now;
    render();
  } else {
    updateNowLine();
  }
}, 60000);
</script>
</body>
</html>
